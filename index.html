<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
        margin-top: 100px;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="seccion-central">
      <div class="seccion-imagen">
        <img class="imagen-1" src="./images/image-equilibrium.jpg" alt="" />
        <div class="vista-hover">
          <img class="icono-vista" src="./images/icon-view.svg" alt="" />
        </div>
      </div>
      <div>
        <h1>Equilibrium #3429</h1>
      </div>
      <div class="seccion-descripcion">
        <p>Our Equilibrium collection promotes balance and calm.</p>
      </div>

      <div class="seccion-detalle">
        <div class="izquierda">
          <img class="icon-ethereum" src="./images/icon-ethereum.svg" alt="" />
          <h3>0.041 ETH</h3>
        </div>
        <div class="derecha">
          <img src="./images/icon-clock.svg" alt="" />
          <h3>3 days left</h3>
        </div>
      </div>
      <hr />
      <div class="seccion-artista">
        <img class="avatar" src="./images/image-avatar.png" alt="" />
        <p>Creation of <span class="nombre">Jules Wyvern</span></p>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Fatima Cañiza</a>.
    </div>
  </body>
</html>
